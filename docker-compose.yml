services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amirl
      POSTGRES_USER: amirl
      POSTGRES_PASSWORD: amirl-local-2026
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amirl -d amirl"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - amirl_postgres:/var/lib/postgresql/data

volumes:
  amirl_postgres:
