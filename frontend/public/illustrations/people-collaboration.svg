<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Collaborative intelligence</title><desc id="desc">Researchers with different expertise connect through shared reviewed work and discovery.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.08em}.k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}.orbit{fill:none;stroke:var(--b);stroke-opacity:.25;stroke-dasharray:4 12;animation:pulse 6s ease-in-out infinite}.orbit.outer{animation-delay:-3s}.link{stroke:var(--b);stroke-opacity:.34;stroke-width:1.2;stroke-dasharray:5 9;animation:trace 7s linear infinite}.halo{fill:var(--b);fill-opacity:.05;stroke:var(--b);stroke-opacity:.22;animation:breathe 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.expert:nth-of-type(2) .halo{animation-delay:-.8s}.expert:nth-of-type(3) .halo{animation-delay:-1.6s}.expert:nth-of-type(4) .halo{animation-delay:-2.4s}.expert:nth-of-type(5) .halo{animation-delay:-3.2s}.expert:nth-of-type(6) .halo{animation-delay:-4s}.node{fill:var(--c);stroke:var(--b);stroke-width:1.6}.packet{fill:var(--b);filter:drop-shadow(0 0 5px #05217b66)}.expert text,.shared text,.output text{font-size:9px}.shared circle{fill:var(--b);animation:core 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.shared text{fill:white;font-weight:700}.output path{fill:none;stroke:var(--b);stroke-width:1.5}.output circle{fill:var(--b)}@keyframes pulse{50%{opacity:.42}}@keyframes trace{to{stroke-dashoffset:-84}}@keyframes breathe{50%{opacity:.5;transform:scale(1.18)}}@keyframes core{50%{opacity:.82;transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){.orbit,.link,.halo,.shared circle{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(-56)"><text class="k" x="242" y="64">COLLABORATIVE INTELLIGENCE</text><text class="m" x="242" y="112">DIFFERENT EXPERTISE → SHARED DISCOVERY</text><circle class="orbit outer" cx="500" cy="330" r="175"/><circle class="orbit" cx="500" cy="330" r="110"/>
    <g class="expert" transform="translate(225 250)"><path class="link" d="M0 0 275 80"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="-38">VISION</text></g><g class="expert" transform="translate(310 420)"><path class="link" d="M0 0 190-90"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="44">NLP</text></g><g class="expert" transform="translate(505 455)"><path class="link" d="M0 0-5-125"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="-38">DATA</text></g><g class="expert" transform="translate(700 405)"><path class="link" d="M0 0-200-75"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="44">SYSTEMS</text></g><g class="expert" transform="translate(745 225)"><path class="link" d="M0 0-245 105"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="-38">HEALTH</text></g><g class="expert" transform="translate(500 205)"><path class="link" d="M0 0v125"/><circle class="halo" r="28"/><circle class="node" r="14"/><text text-anchor="middle" y="44">CLIMATE</text></g>
    <circle class="packet" r="4"><animateMotion dur="5s" path="M225 250 500 330" repeatCount="indefinite"/></circle><circle class="packet" r="4"><animateMotion begin="-1.8s" dur="5.5s" path="M745 225 500 330" repeatCount="indefinite"/></circle><circle class="packet" r="4"><animateMotion begin="-3.2s" dur="6s" path="M310 420 500 330" repeatCount="indefinite"/></circle>
    <g class="shared" transform="translate(500 330)"><circle r="63"/><text text-anchor="middle" y="-5">SHARED</text><text text-anchor="middle" y="13">WORK</text></g><circle class="packet" r="4"><animateMotion dur="4.5s" path="M563 330H757" repeatCount="indefinite"/></circle><g class="output" transform="translate(815 330)"><path d="M-58 0h36"/><circle cx="-5" cy="-28" r="8"/><circle cx="17" r="8"/><circle cx="-5" cy="28" r="8"/><text text-anchor="middle" y="55">DISCOVERY</text></g>
  </g>
</svg>
