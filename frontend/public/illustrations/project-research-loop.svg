<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Research project loop</title><desc id="desc">A project moves from a question to a prototype, human evaluation and repeatable results.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.09em}.k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}.loop{fill:none;stroke:var(--b);stroke-dasharray:7 16;stroke-width:1.5;animation:trace 9s linear infinite}.packet{fill:var(--b)}.node{fill:var(--c);stroke:var(--b);stroke-width:1.8}.verified .node{fill:var(--b)}.num,.label,.metric text{font-size:9px}.label{font-size:10px;font-weight:700}.verified .num{fill:white}.review{font-size:8px;opacity:.72}.metric rect{fill:var(--b);fill-opacity:.18;animation:grow 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.metric rect:nth-of-type(2){animation-delay:-1s}.metric rect:nth-of-type(3){animation-delay:-2s}.metric rect:nth-of-type(4){animation-delay:-3s}.metric text{opacity:.7}@keyframes trace{to{stroke-dashoffset:-104}}@keyframes grow{50%{opacity:.55;transform:scaleY(.72)}}@media(prefers-reduced-motion:reduce){.loop,.metric rect{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(-57)"><text class="k" x="242" y="64">RESEARCH LOOP</text><text class="m" x="242" y="112">HYPOTHESIS → MEASURABLE OUTCOME</text>
    <path class="loop" d="M255 330A250 138 0 1 1 755 330 250 138 0 1 1 255 330"/><circle class="packet" r="4"><animateMotion dur="8s" path="M255 330A250 138 0 1 1 755 330 250 138 0 1 1 255 330" repeatCount="indefinite"/></circle>
    <g transform="translate(255 330)"><circle class="node" r="20"/><text class="num" text-anchor="middle" y="4">01</text><text class="label" text-anchor="middle" y="48">QUESTION</text></g>
    <g transform="translate(505 192)"><circle class="node" r="20"/><text class="num" text-anchor="middle" y="4">02</text><text class="label" text-anchor="middle" y="-38">PROTOTYPE</text></g>
    <g class="verified" transform="translate(755 330)"><circle class="node" r="25"/><text class="num" text-anchor="middle" y="4">03</text><text class="label" text-anchor="middle" y="48">EVALUATE</text><text class="review" text-anchor="middle" y="66">HUMAN REVIEW</text></g>
    <g transform="translate(505 468)"><circle class="node" r="20"/><text class="num" text-anchor="middle" y="4">04</text><text class="label" text-anchor="middle" y="48">REPEAT</text></g>
    <g class="metric" transform="translate(505 330)"><text text-anchor="middle" y="-26">MEASURE</text><rect x="-38" y="-2" width="10" height="48" rx="4"/><rect x="-17" y="-24" width="10" height="70" rx="4"/><rect x="4" y="-11" width="10" height="57" rx="4"/><rect x="25" y="-36" width="10" height="82" rx="4"/><text text-anchor="middle" y="68">COMPARE · LEARN · REPEAT</text></g>
  </g>
</svg>
