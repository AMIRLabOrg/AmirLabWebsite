<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Dataset lineage</title><desc id="desc">Raw records become structured, versioned, licensed, accessible and citable evidence.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6;--s:#fff;--l:#dcdfe6}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.09em}.k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}.path{fill:none;stroke:var(--b);stroke-opacity:.35;stroke-dasharray:5 10;stroke-width:1.5}.packet{fill:var(--b)}.source ellipse,.source path{fill:var(--c);stroke:var(--b);stroke-width:1.6}.stream rect{fill:#f0f2f8;stroke:var(--b);stroke-opacity:.42;animation:shift 3.8s ease-in-out infinite;transform-box:fill-box}.stream rect:nth-child(2n){animation-delay:-1.2s}.stream rect:nth-child(3n){animation-delay:-2.4s}.schema rect{fill:#f4f5f9;stroke:var(--b);stroke-opacity:.25;animation:scan 4.8s ease-in-out infinite}.schema rect:nth-child(4n+2){animation-delay:-1.2s}.schema rect:nth-child(4n+3){animation-delay:-2.4s}.schema rect:nth-child(4n){animation-delay:-3.6s}.idx{font-size:9px;opacity:.62}.ring{fill:none;stroke:var(--b);stroke-opacity:.35}.outer{stroke-dasharray:4 8;animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.core{fill:var(--b)}.check{fill:none;stroke:white;stroke-linecap:round;stroke-linejoin:round;stroke-width:3}.proof-label{font-size:9px;opacity:.5}.proof rect{fill:var(--s);stroke:var(--l)}.proof circle{fill:var(--b)}.proof text{font-size:9px}@keyframes shift{50%{opacity:.48;transform:translateX(7px)}}@keyframes scan{50%{fill:#dce2f3}}@keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.stream rect,.schema rect,.outer{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(15)"><text class="k" x="242" y="64">DATA LINEAGE</text><text class="m" x="242" y="112">RAW RECORDS → REUSABLE EVIDENCE</text><path class="path" d="M132 318C245 318 248 270 362 270S505 342 610 318 710 265 790 265"/><circle class="packet" r="4"><animateMotion dur="5.5s" path="M132 318C245 318 248 270 362 270S505 342 610 318 710 265 790 265" repeatCount="indefinite"/></circle>
    <g class="source" transform="translate(105 300)"><ellipse cy="-24" rx="42" ry="13"/><path d="M-42-24v52c0 8 19 14 42 14s42-6 42-14v-52"/><path d="M-42 2c0 8 19 14 42 14S42 10 42 2M-42 27c0 8 19 14 42 14S42 35 42 27"/><text class="idx" text-anchor="middle" y="70">01 · RAW</text></g>
    <g class="stream" transform="translate(215 235)"><rect width="38" height="17" rx="3"/><rect x="54" y="23" width="49" height="17" rx="3"/><rect y="46" width="60" height="17" rx="3"/><rect x="54" y="69" width="38" height="17" rx="3"/><rect y="92" width="49" height="17" rx="3"/><rect x="54" y="115" width="60" height="17" rx="3"/></g>
    <g class="schema" transform="translate(390 230)"><rect width="48" height="32" rx="4"/><rect x="57" width="48" height="32" rx="4"/><rect x="114" width="48" height="32" rx="4"/><rect y="40" width="48" height="32" rx="4"/><rect x="57" y="40" width="48" height="32" rx="4"/><rect x="114" y="40" width="48" height="32" rx="4"/><rect y="80" width="48" height="32" rx="4"/><rect x="57" y="80" width="48" height="32" rx="4"/><rect x="114" y="80" width="48" height="32" rx="4"/><rect y="120" width="48" height="32" rx="4"/><rect x="57" y="120" width="48" height="32" rx="4"/><rect x="114" y="120" width="48" height="32" rx="4"/><text class="idx" text-anchor="middle" x="81" y="188">02 · STRUCTURED</text></g>
    <g transform="translate(735 285)"><circle class="ring outer" r="72"/><circle class="ring" r="51"/><circle class="core" r="31"/><path class="check" d="m-13 0 9 9 20-22"/><text class="idx" text-anchor="middle" y="105">03 · CITABLE</text></g>
    <g class="proof" transform="translate(242 500)"><text class="proof-label">TRACEABLE BY DESIGN</text><g transform="translate(0 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">VERSION</text></g><g transform="translate(145 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">LICENSE</text></g><g transform="translate(290 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">ACCESS</text></g></g>
  </g>
</svg>
