<title id="t">AMIR Lab as a research consortium</title>
<desc id="d">University and industry members send work into AMIR Lab at the centre, which turns it into research, development, training and responsible practice.</desc>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.lbl{font-size:9px;fill:#1f2421;opacity:.55}
.lblb{font-size:9px;fill:#315bd6;font-weight:600}
.edge{fill:none;stroke:#aab3ad;stroke-linecap:round}
.node{fill:#f7f8f6;stroke:#1f2421;stroke-opacity:.5;stroke-width:1}
.pin{fill:#1f2421;opacity:.5}
.in{fill:none;stroke:#315bd6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:14 200;stroke-dashoffset:214;opacity:0;animation:in 8.0s linear infinite}
.out{fill:none;stroke:#315bd6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:12 200;stroke-dashoffset:212;opacity:0;animation:out 8.0s linear infinite}
.core{fill:#315bd6;opacity:0;animation:core 8.0s ease-in-out infinite}
.ring{fill:none;stroke:#315bd6;stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 8.0s ease-out infinite}
.orbit{fill:none;stroke:#315bd6;stroke-opacity:.3;stroke-dasharray:2 5;transform-origin:320px 240px;animation:spin 80s linear infinite}
.inner{fill:none;stroke:#1f2421;stroke-opacity:.18;stroke-dasharray:3 4}
@keyframes in{0%{stroke-dashoffset:214;opacity:0}1%{opacity:1}10.45%{opacity:1}11.25%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes out{0%{stroke-dashoffset:212;opacity:0}1%{opacity:1}6.08%{opacity:1}6.88%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes core{0%{opacity:0}2%,20%{opacity:var(--pk,.95)}30%,100%{opacity:0}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}10%,100%{opacity:0;transform:scale(2.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.out{stroke-dashoffset:0;opacity:.3}.core{opacity:.6}}
</style>
