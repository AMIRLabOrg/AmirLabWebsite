<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Verified publication evidence</title><desc id="desc">A DOI, venue and authorship record connect to a canonical paper and its human review.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6;--s:#fff}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.09em}.k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}.link{fill:none;stroke:var(--b);stroke-opacity:.42;stroke-dasharray:5 9;stroke-width:1.4}.packet{fill:var(--b)}.source circle,.authors circle{fill:var(--c);stroke:var(--b);stroke-width:1.6}.source text,.authors text,.sheet text,.seal text{font-size:9px}.sheet>path{fill:var(--s);stroke:var(--b);stroke-linejoin:round;stroke-width:1.6}.sheet rect{fill:var(--b);fill-opacity:.16}.ring{fill:none;stroke:var(--b);stroke-opacity:.35;stroke-dasharray:4 8;animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.core{fill:var(--b)}.check{fill:none;stroke:white;stroke-linecap:round;stroke-linejoin:round;stroke-width:3}@keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(-19)"><text class="k" x="242" y="64">PUBLICATION EVIDENCE</text><text class="m" x="242" y="112">SOURCE + AUTHORSHIP → VERIFIED RECORD</text>
    <path class="link" d="M185 250C285 250 330 290 420 300M190 385C290 385 330 340 420 325M495 205C495 240 490 255 485 280M555 430C545 395 530 375 515 350M565 315C650 315 690 315 755 315"/>
    <g class="source" transform="translate(145 250)"><circle r="38"/><text text-anchor="middle" y="4">DOI</text></g><g class="source" transform="translate(145 385)"><circle r="38"/><text text-anchor="middle" y="4">VENUE</text></g>
    <g class="authors" transform="translate(495 185)"><circle cx="-24" cy="8" r="17"/><circle cx="24" cy="8" r="17"/><circle cy="-20" r="17"/><text text-anchor="middle" y="42">AUTHORS</text></g>
    <g class="sheet" transform="translate(420 270)"><path d="M0 0h126l28 28v102H0z"/><path d="M126 0v28h28"/><rect x="24" y="37" width="93" height="8" rx="4"/><rect x="24" y="59" width="108" height="6" rx="3"/><rect x="24" y="77" width="86" height="6" rx="3"/><rect x="24" y="95" width="102" height="6" rx="3"/><text text-anchor="middle" x="77" y="151">CANONICAL RECORD</text></g>
    <g class="seal" transform="translate(775 315)"><circle class="ring" r="56"/><circle class="core" r="34"/><path class="check" d="m-13 0 9 9 20-22"/><text text-anchor="middle" y="78">REVIEWED</text></g><circle class="packet" r="4"><animateMotion dur="5s" path="M565 315C650 315 690 315 755 315" repeatCount="indefinite"/></circle>
  </g>
</svg>
