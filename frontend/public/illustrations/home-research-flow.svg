<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Applied intelligence research flow</title>
  <desc id="desc">A research idea moves from observation through learning and human verification to deployment.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6;--s:#fff;--l:#dcdfe6}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.1em}
    .k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}
    .base,.flow{fill:none;stroke-linecap:round}.base{stroke:var(--b);stroke-opacity:.18;stroke-width:2}.flow{stroke:var(--b);stroke-dasharray:8 18;stroke-width:1.5;animation:trace 7s linear infinite}
    .packet{fill:var(--b)}.halo{fill:var(--b);fill-opacity:.04;stroke:var(--b);stroke-opacity:.15;animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .node{fill:var(--c);stroke:var(--b);stroke-width:2}.verified .node{fill:var(--b)}.glyph{fill:none;stroke:var(--b);stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}.verified .glyph{stroke:white}
    .index{font-size:9px;opacity:.5}.label{font-size:10px;font-weight:700}.review{font-size:8px;opacity:.72}.proof-label{font-size:9px;opacity:.5}.proof rect{fill:var(--s);stroke:var(--l)}.proof circle{fill:var(--b)}.proof text{font-size:9px}
    @keyframes trace{to{stroke-dashoffset:-104}}@keyframes breathe{50%{opacity:.4;transform:scale(1.14)}}
    @media(prefers-reduced-motion:reduce){.flow,.halo{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(13)">
    <text class="k" x="242" y="64">APPLIED INTELLIGENCE</text>
    <text class="m" x="242" y="112">REAL PROBLEM → VERIFIED SYSTEM</text>
    <path class="base" d="M95 330C175 330 245 270 325 270S475 330 555 330 705 270 785 270"/>
    <path class="flow" d="M95 330C175 330 245 270 325 270S475 330 555 330 705 270 785 270"/>
    <circle class="packet" r="4"><animateMotion dur="6s" path="M95 330C175 330 245 270 325 270S475 330 555 330 705 270 785 270" repeatCount="indefinite"/></circle>
    <circle class="packet" r="4"><animateMotion begin="-2s" dur="6s" path="M95 330C175 330 245 270 325 270S475 330 555 330 705 270 785 270" repeatCount="indefinite"/></circle>
    <circle class="packet" r="4"><animateMotion begin="-4s" dur="6s" path="M95 330C175 330 245 270 325 270S475 330 555 330 705 270 785 270" repeatCount="indefinite"/></circle>
    <g transform="translate(95 330)"><circle class="halo" r="29"/><circle class="node" r="18"/><path class="glyph" d="M-8-5h16M-8 0h16M-8 5h16"/><text class="index" text-anchor="middle" y="-45">01</text><text class="label" text-anchor="middle" y="55">OBSERVE</text></g>
    <g transform="translate(325 270)"><circle class="halo" r="29" style="animation-delay:-1.1s"/><circle class="node" r="18"/><g class="glyph"><circle cx="-7" cy="-5" r="2.5"/><circle cx="7" r="2.5"/><circle cx="-7" cy="6" r="2.5"/><path d="M-4.5-4 4.5-1M-4.5 5 4.5 1"/></g><text class="index" text-anchor="middle" y="-45">02</text><text class="label" text-anchor="middle" y="55">LEARN</text></g>
    <g class="verified" transform="translate(555 330)"><circle class="halo" r="35" style="animation-delay:-2.2s"/><circle class="node" r="18"/><path class="glyph" d="m-8 0 5 5L9-7"/><text class="index" text-anchor="middle" y="-45">03</text><text class="label" text-anchor="middle" y="55">VERIFY</text><text class="review" text-anchor="middle" y="77">HUMAN VERIFIED</text></g>
    <g transform="translate(785 270)"><circle class="halo" r="29" style="animation-delay:-3.3s"/><circle class="node" r="18"/><path class="glyph" d="M-8 7 8-7M1-7h7v7"/><text class="index" text-anchor="middle" y="-45">04</text><text class="label" text-anchor="middle" y="55">DEPLOY</text></g>
    <g class="proof" transform="translate(242 500)"><text class="proof-label">TRACEABLE BY DESIGN</text><g transform="translate(0 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">EVIDENCE</text></g><g transform="translate(145 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">REVIEW</text></g><g transform="translate(290 18)"><rect width="126" height="28" rx="14"/><circle cx="16" cy="14" r="3"/><text x="28" y="18">IMPACT</text></g></g>
  </g>
</svg>
