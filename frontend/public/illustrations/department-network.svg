<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 520" role="img" aria-labelledby="title desc">
  <title id="title">AmirLab research departments</title>
  <desc id="desc">Six specialized research departments connect through one shared lab and exchange knowledge across disciplines.</desc>
  <style>
    :root{--b:#05217b;--i:#171a22;--c:#f8f8f6}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--b);letter-spacing:.09em}.k{font-size:11px;opacity:.58}.m{font:500 27px Georgia,serif;fill:var(--i);letter-spacing:-.025em}.orbit,.link{fill:none;stroke:var(--b)}.orbit{stroke-opacity:.2;stroke-dasharray:4 11;animation:orbit 20s linear infinite;transform-box:fill-box;transform-origin:center}.orbit.inner{animation-direction:reverse;animation-duration:14s}.link{stroke-opacity:.32;stroke-width:1.35}.unit .halo{fill:var(--b);fill-opacity:.045;stroke:var(--b);stroke-opacity:.2;animation:breathe 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.unit:nth-of-type(2n) .halo{animation-delay:-1.6s}.unit:nth-of-type(3n) .halo{animation-delay:-3.2s}.unit .node{fill:var(--c);stroke:var(--b);stroke-width:1.7}.unit text,.core text{font-size:9px}.core circle{fill:var(--b)}.core text{fill:white;font-weight:700}.packet{fill:var(--b);filter:drop-shadow(0 0 4px #05217b66)}.caption{font-size:9px;opacity:.55}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.45;transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.orbit,.halo{animation:none}.packet{display:none}}
  </style>
  <g transform="translate(-42)">
    <text class="k" x="242" y="64">RESEARCH ORGANIZATION</text>
    <text class="m" x="242" y="112">SPECIALIZED UNITS → SHARED INTELLIGENCE</text>
    <g transform="translate(535 330)">
      <circle class="orbit" r="177"/><circle class="orbit inner" r="108"/>
      <path class="link" d="M0 0-238-72M0 0-147 143M0 0 8 166M0 0 160 126M0 0 229-66M0 0 18-162"/>
      <g class="unit" transform="translate(-238 -72)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="-39">HEALTH</text></g>
      <g class="unit" transform="translate(-147 143)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="43">LANGUAGE</text></g>
      <g class="unit" transform="translate(8 166)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="43">VISION</text></g>
      <g class="unit" transform="translate(160 126)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="43">DATA</text></g>
      <g class="unit" transform="translate(229 -66)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="-39">SECURITY</text></g>
      <g class="unit" transform="translate(18 -162)"><circle class="halo" r="28"/><circle class="node" r="15"/><text text-anchor="middle" y="-39">SYSTEMS</text></g>
      <g class="core"><circle r="58"/><text text-anchor="middle" y="-5">AMIRLAB</text><text text-anchor="middle" y="13">COMMON CORE</text></g>
      <circle class="packet" r="4"><animateMotion dur="5.2s" path="M-238-72 0 0" repeatCount="indefinite"/></circle>
      <circle class="packet" r="4"><animateMotion begin="-1.8s" dur="5.8s" path="M229-66 0 0" repeatCount="indefinite"/></circle>
      <circle class="packet" r="4"><animateMotion begin="-3.4s" dur="6.2s" path="M8 166 0 0" repeatCount="indefinite"/></circle>
      <circle class="packet" r="4"><animateMotion begin="-2.2s" dur="6s" path="M0 0 160 126" repeatCount="indefinite"/></circle>
    </g>
    <text class="caption" x="242" y="525">INDEPENDENT FOCUS · SHARED METHODS · CONNECTED DISCOVERY</text>
  </g>
</svg>
